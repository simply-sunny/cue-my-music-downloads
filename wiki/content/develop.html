<h1>Develop</h1>
<div class="prose" id="develop"><p>Requires JDK 25 and a built Cue My Music in <code>../cue-my-music</code> (<code>./gradlew buildAll</code> there), which the add-on compiles against for playlists; see <code>gradle.properties</code>. Then <code>./gradlew build</code> builds the jar into <code>build/libs/</code>.</p></div>
